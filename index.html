<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WEBAR + MAP Switch (2 POIs)</title>

  <!-- ===== Leaflet (2D Map) ===== -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- ===== A-Frame / AR.js (AR View) ===== -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin:0; overflow:hidden; font-family:"Helvetica Neue",sans-serif; }

    /* ===== Top switch UI ===== */
    #topbar{
      position:fixed; top:10px; left:10px; right:10px;
      display:flex; gap:10px;
      z-index:2000;
      pointer-events:none;
    }
    .btn{
      pointer-events:auto;
      flex:1;
      padding:12px 10px;
      border:none;
      border-radius:12px;
      background:#111;
      color:#fff;
      font-size:15px;
      opacity:.92;
      cursor:pointer;
    }
    .btn.active{ background:#007aff; }

    /* ===== Views ===== */
    .view{
      position:fixed; inset:0;
      display:none;
      z-index:1;
    }
    .view.active{ display:block; }

    #map{ width:100%; height:100%; }

    /* ===== Popup modal ===== */
    #popup{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      background:#fff; color:#000;
      padding:18px; border-radius:14px;
      box-shadow:0 10px 28px rgba(0,0,0,.35);
      width:90%; max-width:380px;
      display:none; z-index:3000;
    }

    #popup h2{ margin:0 0 8px; font-size:18px; }
    #popup img{ width:100%; border-radius:10px; margin:10px 0; display:none; }
    #popup p{ margin:0; font-size:14px; line-height:1.6; }
    #popup button{
      margin-top:14px;
      padding:10px 18px;
      border:none;
      border-radius:10px;
      background:#007aff; color:#fff;
      font-size:15px; cursor:pointer;
      width:100%;
    }

    /* ===== Logs ===== */
    #logs{
      position:fixed; bottom:0; left:0; right:0;
      background:rgba(0,0,0,.55); color:#0f0;
      padding:6px 8px; font-size:11px;
      z-index:2500;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Leaflet attribution（右下）をログに被せない */
    .leaflet-control-attribution{
      margin-bottom:42px !important;
    }

    /* ===== AR領域をフルスクリーン固定（重要） ===== */
    #viewAR, #arMount {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #arMount a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #arMount canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>

<body>

  <!-- ===== Switch Bar ===== -->
  <div id="topbar">
    <button id="btnMap" class="btn active" onclick="showView('map')">地図（2D）</button>
    <button id="btnAR" class="btn" onclick="showView('ar')">AR</button>
  </div>

  <!-- ===== Popup ===== -->
  <div id="popup">
    <h2 id="popupTitle">タイトル</h2>
    <img id="popupImg" src="" alt="">
    <p id="popupText"></p>
    <button onclick="closePopup()">閉じる</button>
  </div>


  <div id="logs">[MAP] 準備中...</div>

  <!-- ===== MAP VIEW ===== -->
  <div id="viewMap" class="view active">
    <div id="map"></div>
  </div>

  <!-- ===== AR VIEW ===== -->
  <div id="viewAR" class="view">
    <div id="arMount"></div>
  </div>

    han: `越後与板藩`,

越後国は日本海側の要地であり、与板藩は信濃・越後・北陸方面を結ぶ交通・軍事上の要衝に位置していた。<br>

江戸時代には、実務を伴う官職ではなく、大名や上級武士に与えられる名誉的な官位として用いられた。<br>
井伊直経が「兵部少輔」を名乗っていたことは、譜代大名としての家格と、幕府中枢に連なる家柄であることを示している。`,
    lat: 35.63194803522692,
    lon: 139.7355121486548
  },
  {
    id: "p12",
    name: "松平薩摩守斉彬",
    summary: `松平薩摩守斉彬は、江戸時代後期の大名で、薩摩鹿児島藩主「島津斉彬」のことである。<br>
斉彬は幕末期を代表する有力大名の一人で、西洋技術の導入や軍制改革を進めたことで知られる。<br>
薩摩藩の近代化を主導し、幕末政治にも大きな影響を与えた人物である。`,
    han: `薩摩鹿児島藩`,
    hanText: `薩摩鹿児島藩は、江戸時代に薩摩国鹿児島城（現在の鹿児島県鹿児島市）を本拠とした藩である。<br>
藩主は島津氏で、石高七十万石余を有する西国最大級の外様大藩であった。<br>

    role: `薩摩守`,
    roleText: `「薩摩守（さつまのかみ）」は朝廷から授けられた官位で、本来は薩摩国を管轄する国司の長官を指す官職名であった。<br>
江戸時代には実務を伴わない名誉的官位であり、大名の家格を示す称号として用いられた。`,
    lat: 35.6301330749833,
    lon: 139.73697112507466
  }

let popupData = Object.fromEntries(poiList.map(p => [p.id, p]));

function getKamonIcon(poi){
  if (poi.icon) return poi.icon;
  return hanKamonIcon[poi.han] || "./default.png";
}

/* =========================================================
   ② ポップアップ
   ========================================================= */
const popup = document.getElementById("popup");
const popupTitle = document.getElementById("popupTitle");
const popupText = document.getElementById("popupText");
const popupImg = document.getElementById("popupImg");
const logs = document.getElementById("logs");

function escHtml(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function openPopup(poi) {
  popupTitle.textContent = poi.name || "";
  popupImg.style.display = "none"; // ポップアップ内に家紋は表示しない

  popupText.innerHTML = `
    <div style="font-size:12px; opacity:.75; margin-bottom:8px;">
      藩：<b>${escHtml(poi.han)}</b> ／ 役職：<b>${escHtml(poi.role)}</b>
    </div>

    <div style="border-top:1px solid #eee; padding-top:10px;">
      <div style="font-weight:700; margin-bottom:4px;">概要</div>
      <div style="font-size:14px; line-height:1.65;">${poi.summary || ""}</div>
    </div>

    <details style="margin-top:10px;">
      <summary style="cursor:pointer; font-weight:700;">藩の説明</summary>
      <div style="margin-top:6px; font-size:14px; line-height:1.65;">${poi.hanText || ""}</div>
    </details>

    <details style="margin-top:10px;">
      <summary style="cursor:pointer; font-weight:700;">役職の説明</summary>
      <div style="margin-top:6px; font-size:14px; line-height:1.65;">${poi.roleText || ""}</div>
    </details>
  `;

  popup.style.display = "block";
}

function closePopup() {
  popup.style.display = "none";
}

/* =========================================================
   ③ 画面切替（Map / AR）
   ========================================================= */
const viewMap = document.getElementById("viewMap");
const viewAR  = document.getElementById("viewAR");
const btnMap  = document.getElementById("btnMap");
const btnAR   = document.getElementById("btnAR");
const arMount = document.getElementById("arMount");
let arSceneEl = null;

function showView(which){
  if(which === "map"){
    viewMap.classList.add("active");
    viewAR.classList.remove("active");
    btnMap.classList.add("active");
    btnAR.classList.remove("active");
    destroyAR();
    if (!logs.textContent.startsWith("[MAP]")) logs.textContent = "[MAP] 表示中...";
  }else{
    viewAR.classList.add("active");
    viewMap.classList.remove("active");
    btnAR.classList.add("active");
    btnMap.classList.remove("active");
    buildAR();
    if (!logs.textContent.startsWith("[AR]")) logs.textContent = "[AR] 表示中...";
  }
}

/* =========================================================
   ④ MAP (Leaflet + OSM)
   ========================================================= */
let map, userMarker;

function initMap(){
  map = L.map("map").setView([35.83840, 139.55582], 17);

  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  Object.entries(popupData).forEach(([id, poi]) => {
    const icon = L.icon({
      iconUrl: getKamonIcon(poi),
      iconSize: [100, 100],
      iconAnchor: [50, 0],
      popupAnchor: [0, -18]
    });

    const m = L.marker([poi.lat, poi.lon], { icon }).addTo(map);
    m.on("click", () => openPopup(poi));
    m.bindTooltip(poi.name, { direction:"top" });
  });

  if(navigator.geolocation){
    navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        const ll = [latitude, longitude];

        if(!userMarker){
          userMarker = L.circleMarker(ll, { radius: 8 }).addTo(map);
          map.setView(ll, 17);
        }else{
          userMarker.setLatLng(ll);
        }

        logs.textContent = `[MAP] lat:${latitude.toFixed(6)} lon:${longitude.toFixed(6)} acc:${Math.round(accuracy)}m`;
      },
      (err) => {
        logs.textContent = `[MAP] 位置情報エラー: ${err.message}`;
      },
      { enableHighAccuracy:true, maximumAge:1000, timeout:8000 }
    );
  } else {
    logs.textContent = "[MAP] Geolocation未対応ブラウザです";
  }
}

/* =========================================================
   ⑤ AR (A-Frame / AR.js)  ★a-assets事前ロード版
   ========================================================= */
function buildAR(){
  if(arSceneEl) return;

  // ▼ a-assets に img を入れて事前ロード
  const assetsHtml = Object.entries(popupData).map(([id, poi]) => {
    const icon = getKamonIcon(poi);
    // 重要：#asset_{id} として参照する
    return `<img id="asset_${id}" src="${icon}" crossorigin="anonymous">`;
  }).join("");

  const markersHtml = Object.entries(popupData).map(([id, poi]) => {
    return `
      <a-image
        id="${id}"
        class="clickable"
        src="#asset_${id}"
        width="22"
        height="22"
        look-at="[gps-camera]"
        gps-entity-place="latitude: ${poi.lat}; longitude: ${poi.lon};"
        visible="true">
      </a-image>
    `;
  }).join("");

  const sceneHtml = `
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false; gpsMinDistance: 0; gpsTimeInterval: 1000;"
    >
      <a-assets>
        ${assetsHtml}
      </a-assets>

      ${markersHtml}

      <a-camera gps-camera rotation-reader>
        <a-cursor
          fuse="false"
          raycaster="objects: .clickable"
          geometry="primitive: circle; radius: 0.003"
          material="color: black; opacity: 0.8">
        </a-cursor>
      </a-camera>
    </a-scene>
  `;

  arMount.innerHTML = sceneHtml;
  arSceneEl = arMount.querySelector("a-scene");

  logs.textContent = "[AR] scene mounted. GPS waiting...";

  // ▼ 画像ロード状況をログ（読み込み失敗の切り分け）
  Object.keys(popupData).forEach(id => {
    const img = document.getElementById(`asset_${id}`);
    if(!img) return;
    img.addEventListener("load", () => {
      logs.textContent = `[AR] asset loaded: asset_${id}`;
    });
    img.addEventListener("error", () => {
      logs.textContent = `[AR] asset ERROR: asset_${id} (path maybe wrong)`;
    });
  });

  // ARでタップ→ポップアップ
  arSceneEl.querySelectorAll(".clickable").forEach(el => {
    el.addEventListener("click", () => {
      const poi = popupData[el.id];
      if(poi) openPopup(poi);
    });
  });

  // ▼ GPS更新イベント（ここが来てるのは確認済み）
  window.addEventListener("gps-camera-update-position", onArGpsUpdate);
  window.addEventListener("gps-camera-error", (e) => {
    logs.textContent = `[AR] gps error: ${JSON.stringify(e.detail || e)}`;
  });
}

function destroyAR(){
  if(!arSceneEl) return;
  window.removeEventListener("gps-camera-update-position", onArGpsUpdate);
  arMount.innerHTML = "";
  arSceneEl = null;
}

function onArGpsUpdate(e){
  const { latitude, longitude, accuracy } = e.detail.position;

  // ▼ まずは「GPSは来てる」を見える化
  logs.textContent = `[AR] gps ok lat:${latitude.toFixed(6)} lon:${longitude.toFixed(6)} acc:${Math.round(accuracy)}m`;

  // 距離によるスケール調整（極端にしない）
  const toRad = d => d * Math.PI / 180;
  const R = 6371000;

  Object.entries(popupData).forEach(([id, poi]) => {
    const markerEl = document.getElementById(id);
    if(!markerEl) return;

    const dLat = toRad(poi.lat - latitude);
    const dLon = toRad(poi.lon - longitude);

    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(toRad(latitude)) *
      Math.cos(toRad(poi.lat)) *
      Math.sin(dLon/2)**2;

    const dist = 2 * R * Math.asin(Math.sqrt(a));

    // ▼ 近いほど大きく（現実的な範囲）
    const minScale = 1.0;
    const maxScale = 0.3;
    const maxDist  = 50;

    const d = Math.min(dist, maxDist);
    const t = d / maxDist;
    const scale = minScale * (1 - t) + maxScale * t;

    markerEl.setAttribute("scale", `${scale} ${scale} ${scale}`);

    // ▼ 透明度は固定で見える化
    markerEl.setAttribute("material", `opacity: 1.0`);

  });
}

/* =========================================================
   起動
   ========================================================= */
initMap();
</script>
